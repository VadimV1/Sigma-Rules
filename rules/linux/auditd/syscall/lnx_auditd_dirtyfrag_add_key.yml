title: DirtyFrag - Unprivileged add_key from Interactive User
id: a5b7c9d1-e3f5-4a7b-c9d2-3e5f7a9b1c3d
status: stable
description: >
    Detects an unprivileged interactive user calling add_key. DirtyFrag's RxRPC path
    uses this to install brute-forced pcbc(fcrypt) session keys before each kernel trigger.
references:
    - https://github.com/V4bel/dirtyfrag
author: 'VadimV1'
date: 2026-05-13
modified: 2026-05-14
tags:
    - attack.privilege-escalation
    - attack.t1068
logsource:
    product: linux
    service: auditd
    definition: |
        Required auditd configuration:
        -a always,exit -F arch=b64 -S add_key -k dirtyfrag_add_key
        -a always,exit -F arch=b32 -S add_key -k dirtyfrag_add_key
detection:
    selection:
        type: 'SYSCALL'
        SYSCALL: 'add_key'
    filter_root:
        uid: 0
    filter_keyring_daemons:
        comm:
            - 'gpg-agent'
            - 'ssh-agent'
            - 'systemd-userdbd'
            - 'gnome-keyring-d'
    condition: selection and not filter_root and not filter_keyring_daemons
falsepositives:
    - GPG agents, SSH-agent, AFS daemons registering tokens
level: medium
