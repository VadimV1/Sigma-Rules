title: DirtyFrag - Unprivileged XFRM Netlink Socket
id: a9b5c3f7-2e4d-4a1b-8c6d-0f7e3d2b1a9c
status: stable
description: Detects an unprivileged AF_NETLINK/NETLINK_XFRM socket used to register fake IPsec SAs.

    Detection tier: **class-atomic** — the kernel mechanism requires netlink-XFRM to deliver the attacker-shaped seq_hi field that drives the page-cache write primitive.
references:
    - https://github.com/V4bel/dirtyfrag
author: 'VadimV1'
date: 2026-05-13
modified: 2026-05-14
tags:
    - attack.privilege-escalation
    - attack.t1068
logsource:
    product: linux
    service: auditd
    definition: |
        Required auditd configuration:
        -a always,exit -F arch=b64 -S socket -F a0=16 -F a2=6 -k dirtyfrag_xfrm_netlink
        -a always,exit -F arch=b32 -S socket -F a0=16 -F a2=6 -k dirtyfrag_xfrm_netlink
detection:
    selection:
        type: 'SYSCALL'
        SYSCALL: 'socket'
        a0: 10
        a1: 3
        a2: 6
    filter_root:
        uid: 0
    condition: selection and not filter_root
falsepositives:
    - IPsec management daemons (strongSwan, Libreswan)
    - wireguard-tools / systemd-networkd configuring xfrm interfaces
    - Kubernetes CNI plugins in IPsec mode (Calico, Cilium)
level: high
